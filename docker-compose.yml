# PrinterUpkeep — Supabase-native deployment.
#
# Only the Flutter web frontend runs here. It talks DIRECTLY to Supabase
# (Auth + PostgREST) over HTTPS from the browser — there is no backend service
# or database in this stack. Security is enforced by Supabase Row-Level Security.
#
# Set SUPABASE_URL + SUPABASE_ANON_KEY in the environment (Coolify). They are
# written into /config.json at container start (app/web-config.sh) and read by
# the app; the anon key is public by design (RLS controls access).
#
#   docker compose up -d
#
services:
  web:
    # Pre-built by CI (.github/workflows/build-web-image.yml) and pulled at
    # deploy time. Override WEB_IMAGE to pin a specific tag/digest. For local
    # development, docker-compose.override.yml re-adds a build context so
    # `docker compose up --build` builds web from ./app source.
    image: ${WEB_IMAGE:-ghcr.io/laurencepeter/printerupkeep-web:main}
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    # Publish the UI on a host port (overridable via WEB_PORT). On Coolify you
    # can instead attach a domain and drop this mapping — the platform proxy
    # routes to the container's exposed port 80.
    ports:
      - "${WEB_PORT:-8082}:80"
    expose:
      - "80"
    # Use 127.0.0.1, not localhost: nginx listens on IPv4 only, and busybox wget
    # resolves localhost to ::1 first (connection-refused) — reporting the
    # container unhealthy even though nginx is serving fine.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
